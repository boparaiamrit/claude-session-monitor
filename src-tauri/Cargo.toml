[package]
name = "claude-session-monitor"
version = "2.0.0"
description = "Watch and control every Claude Code session: 3D office, mission control, approvals and live steering"
authors = ["Amritpal Singh"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's settings.json key order when hooks are added or removed
serde_json = { version = "1", features = ["preserve_order"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "8"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.40"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

# Transcripts can total hundreds of MB; unoptimized JSON parsing is ~20x slower
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
